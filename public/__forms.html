<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Forms</title>
  </head>
  <body>
    <!--
      Hidden skeleton so Netlify Forms registers the React free-class form at deploy time.
      Field names must match components/site/free-class-form.tsx exactly.
    -->
    <form name="free-class" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="free-class" />
      <input type="hidden" name="subject" />
      <input name="bot-field" />
      <input name="name" type="text" />
      <input name="contact" type="text" />
      <select name="class"><option value="">-</option></select>
      <input name="experience" type="radio" value="" />
    </form>
  </body>
</html>
